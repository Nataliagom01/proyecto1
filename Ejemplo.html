<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Nova</title>
<style>
:root{
  --navy:#0f2a5c; --navy-2:#173a7a; --navy-3:#0b1f45;
  --bg:#f3f5f9; --card:#fff; --line:#e2e7f0; --text:#1b2433; --muted:#6b7689;
  --blue:#2457c5; --blue-h:#1c46a3; --green:#1f8a5b; --green-bg:#e6f5ee;
  --red:#c0392b; --red-bg:#fdecea; --amber:#b7791f; --amber-bg:#fdf3dc;
  --radius:10px; --shadow:0 1px 3px rgba(15,42,92,.08);
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button,input,select{font:inherit}
.hidden{display:none!important}

/* ---------- Acceso ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:linear-gradient(160deg,var(--navy-3),var(--navy-2));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-weight:700;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--navy);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.login-hero h1{font-size:34px;line-height:1.15;max-width:420px;margin-bottom:14px}
.login-hero p{color:#b9c6e4;max-width:380px}
.login-panel{display:grid;place-items:center;padding:32px;background:#fff}
.login-box{width:100%;max-width:360px}
.login-box h2{font-size:22px;margin-bottom:4px}
.login-box .sub{color:var(--muted);margin-bottom:22px}
.demo{margin-top:18px;font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px}
.demo b{color:var(--text)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#cfd9f0;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.sidebar .brand{color:#fff;padding:0 8px 22px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cfd9f0;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.active{background:var(--navy-2);color:#fff}
.sidebar .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:13px}
.sidebar .me b{display:block;color:#fff}
.sidebar .me button{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;width:100%}
.sidebar .me button:hover{background:rgba(255,255,255,.1)}
.main{padding:26px 32px;min-width:0}
.sidebar{overflow-y:auto}
.nav h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#7f93c2;margin:14px 12px 4px;font-weight:600}
.g-2{grid-template-columns:1fr 1fr}
.plastic{background:linear-gradient(135deg,var(--navy-3),var(--navy-2));color:#fff;border-radius:14px;padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px}
.plastic.off{filter:grayscale(1);opacity:.65}
.plastic .num{font-size:19px;letter-spacing:2px}
.plastic .exp{color:#b9c6e4;font-size:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar span{display:block;height:100%;background:var(--blue)}
@media(max-width:960px){.nav h4{display:none}.g-2{grid-template-columns:1fr}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:22px}
.topbar .crumb{color:var(--muted);font-size:13px}

/* ---------- Componentes base ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.kpi .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi .value{font-size:26px;font-weight:700;margin-top:4px}
.kpi.dark{background:var(--navy);color:#fff;border:none}
.kpi.dark .label{color:#aebde0}
.btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-h)}
.btn-secondary{background:#fff;border-color:var(--line);color:var(--text)}.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--blue);padding:6px 10px}.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,.select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;color:var(--text);width:100%}
.input:focus,.select:focus{outline:2px solid #bcd0f7;border-color:var(--blue)}
.field.error .input{border-color:var(--red)}
.field .msg{color:var(--red);font-size:12px;min-height:0}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:#e5edfb;color:var(--blue)}
.alert{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:14px}
.alert.info{background:#e5edfb;color:var(--navy)}
.alert.err{background:var(--red-bg);color:var(--red)}
.alert.ok{background:var(--green-bg);color:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:500}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar .input{max-width:260px}.toolbar .select{max-width:170px}
.toolbar .spacer{flex:1}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfd}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.right{text-align:right}
.pos{color:var(--green);font-weight:600}.neg{color:var(--text);font-weight:600}
.empty,.loading{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.pager div{display:flex;gap:6px}
.acc-meta{color:var(--muted);font-size:12px;margin-top:2px;word-break:break-all}

/* ---------- Modal / Toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,31,69,.5);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:in .2s}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

@media(max-width:960px){
  .login{grid-template-columns:1fr}.login-hero{display:none}
  .shell{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sidebar .brand{padding:0 8px}.sidebar .me{margin:0 0 0 auto;border:none;padding:0}
  .nav{display:flex;gap:4px;flex-wrap:wrap}
  .g-4,.g-3,.g-2-1{grid-template-columns:1fr 1fr}
  .main{padding:18px}
}
@media(max-width:600px){.g-4,.g-3,.g-2-1{grid-template-columns:1fr}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   BANCO NOVA · Front-end dinámico
   ---------------------------------------------------------------------
   CÓMO CONECTAR TU BACKEND
   1. Cambia CONFIG.USE_MOCK a false y pon tu URL en CONFIG.API_BASE_URL.
   2. Tu API debe exponer estos endpoints (JSON, auth con Bearer token):

   POST   /auth/login                  {email,password} -> {token, user:{id,name,email,role}}
   POST   /auth/logout
   GET    /accounts                    -> [{id,name,type,clabe,balance,currency}]
   GET    /accounts/:id/transactions?search=&type=&page=&pageSize=
                                       -> {items:[{id,date,concept,type,amount,status}],total,page,pageSize}
          (type: "credit" | "debit"; amount siempre positivo)
   POST   /transfers                   {from_account_id,to_clabe,amount,concept} -> {id,status}
   GET    /admin/stats                 -> {users,active,blocked,volume}
   GET    /admin/users?search=&status= -> [{id,name,email,role,status,created_at}]
   POST   /admin/users                 {name,email,role,password}
   PUT    /admin/users/:id             {name,email,role}
   PATCH  /admin/users/:id/status      {status:"active"|"blocked"}

   --- Endpoints de las pantallas adicionales ---
   POST   /auth/register               {name,email,password}
   POST   /auth/forgot-password        {email}
   GET    /beneficiaries               -> [{id,alias,name,clabe,bank}]
   POST   /beneficiaries               {alias,name,clabe}
   DELETE /beneficiaries/:id
   GET    /services                    -> [{id,name}]
   GET    /payments                    -> [{id,date,service,reference,amount,account,status}]
   POST   /payments                    {from_account_id,service_id,reference,amount}
   GET    /cards                       -> [{id,name,type,last4,expires,status,limit,used}]
   PATCH  /cards/:id                   {status:"active"|"blocked"}
   GET    /profile                     -> {name,email,phone,address}
   PUT    /profile                     {name,phone,address}
   POST   /profile/password            {current,password}
   GET    /admin/transactions?search=&status=&type=&page=&pageSize=
                                       -> {items:[{id,date,customer,account,concept,type,amount,status}],total,page,pageSize}
   GET    /admin/audit?search=&page=&pageSize=
                                       -> {items:[{id,date,actor,action,detail}],total,page,pageSize}

   Errores: responde con HTTP 4xx/5xx y {message:"texto"}. Un 401 cierra sesión.
   Recuerda habilitar CORS en el backend si lo sirves desde otro origen.
   ===================================================================== */
const CONFIG = {
  API_BASE_URL: "http://localhost:3000/api",
  USE_MOCK: true            // true = datos de demostración guardados en localStorage
};

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, cur = "MXN") => new Intl.NumberFormat("es-MX", {style:"currency", currency:cur}).format(n);
const fdate = d => new Date(d).toLocaleDateString("es-MX", {day:"2-digit", month:"short", year:"numeric"});
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type = "") {
  const el = document.createElement("div");
  el.className = "toast " + type; el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function openModal(html) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`;
  root.addEventListener("click", e => { if (e.target.matches(".overlay,[data-close]")) closeModal(); }, {once:false});
  return root;
}
function closeModal() { $("#modal-root").innerHTML = ""; }

/* ---------- Sesión ---------- */
const Session = {
  get token() { return sessionStorage.getItem("nova_token"); },
  get user() { try { return JSON.parse(sessionStorage.getItem("nova_user")); } catch { return null; } },
  set(token, user) { sessionStorage.setItem("nova_token", token); sessionStorage.setItem("nova_user", JSON.stringify(user)); },
  clear() { sessionStorage.removeItem("nova_token"); sessionStorage.removeItem("nova_user"); }
};

/* ---------- Capa HTTP ---------- */
class ApiError extends Error { constructor(m, status) { super(m); this.status = status; } }

async function http(method, path, body) {
  if (CONFIG.USE_MOCK) return Mock.handle(method, path, body);
  const res = await fetch(CONFIG.API_BASE_URL + path, {
    method,
    headers: { "Content-Type": "application/json", ...(Session.token ? {Authorization: "Bearer " + Session.token} : {}) },
    body: body ? JSON.stringify(body) : undefined
  }).catch(() => { throw new ApiError("No se pudo conectar con el servidor", 0); });
  if (res.status === 401 && path !== "/auth/login") {
    Session.clear(); location.hash = "#/login";
    throw new ApiError("Tu sesión expiró", 401);
  }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new ApiError(data?.message || "Error del servidor", res.status);
  return data;
}
const qs = o => { const p = new URLSearchParams(Object.entries(o).filter(([,v]) => v !== "" && v != null)); const s = p.toString(); return s ? "?" + s : ""; };

const Api = {
  login: (email, password) => http("POST", "/auth/login", {email, password}),
  logout: () => http("POST", "/auth/logout").catch(() => {}),
  accounts: () => http("GET", "/accounts"),
  transactions: (id, f) => http("GET", `/accounts/${id}/transactions${qs(f)}`),
  transfer: d => http("POST", "/transfers", d),
  stats: () => http("GET", "/admin/stats"),
  users: f => http("GET", "/admin/users" + qs(f)),
  createUser: d => http("POST", "/admin/users", d),
  updateUser: (id, d) => http("PUT", `/admin/users/${id}`, d),
  setStatus: (id, status) => http("PATCH", `/admin/users/${id}/status`, {status}),
  register: d => http("POST", "/auth/register", d),
  forgot: email => http("POST", "/auth/forgot-password", {email}),
  beneficiaries: () => http("GET", "/beneficiaries"),
  addBeneficiary: d => http("POST", "/beneficiaries", d),
  delBeneficiary: id => http("DELETE", `/beneficiaries/${id}`),
  services: () => http("GET", "/services"),
  payments: () => http("GET", "/payments"),
  pay: d => http("POST", "/payments", d),
  cards: () => http("GET", "/cards"),
  setCardStatus: (id, status) => http("PATCH", `/cards/${id}`, {status}),
  profile: () => http("GET", "/profile"),
  updateProfile: d => http("PUT", "/profile", d),
  changePassword: d => http("POST", "/profile/password", d),
  adminTransactions: f => http("GET", "/admin/transactions" + qs(f)),
  adminAudit: f => http("GET", "/admin/audit" + qs(f))
};

/* ---------- Backend simulado (solo para demo) ---------- */
const Mock = {
  KEY: "nova_mock_db_v2",
  seed() {
    const now = Date.now(), day = 864e5;
    const tx = (i, daysAgo, concept, type, amount, st = "completed") => ({id: "t" + i, date: new Date(now - daysAgo * day).toISOString(), concept, type, amount, status: st});
    return {
      credentials: { "ana@banconova.mx": {password: "Nova1234", userId: 1}, "admin@banconova.mx": {password: "Admin1234", userId: 2} },
      users: [
        {id:1, name:"Ana Martínez", email:"ana@banconova.mx", role:"customer", status:"active", created_at:"2025-02-11"},
        {id:2, name:"Admin Nova", email:"admin@banconova.mx", role:"admin", status:"active", created_at:"2024-11-02"},
        {id:3, name:"Luis Hernández", email:"luis@correo.mx", role:"customer", status:"active", created_at:"2025-06-23"},
        {id:4, name:"Sofía Ramírez", email:"sofia@correo.mx", role:"customer", status:"blocked", created_at:"2025-08-05"},
        {id:5, name:"Carlos Ortega", email:"carlos@correo.mx", role:"customer", status:"active", created_at:"2026-01-17"},
        {id:6, name:"Marta Núñez", email:"marta@banconova.mx", role:"admin", status:"active", created_at:"2026-03-09"}
      ],
      accounts: [
        {id:1, userId:1, name:"Cuenta de nómina", type:"Débito", clabe:"012180001234567891", balance:48250.75, currency:"MXN"},
        {id:2, userId:1, name:"Ahorro Nova", type:"Ahorro", clabe:"012180009876543217", balance:120400.00, currency:"MXN"}
      ],
      tx: {
        1: [tx(1,1,"Depósito de nómina","credit",18500),tx(2,2,"Supermercado La Central","debit",1240.5),tx(3,3,"Pago de luz CFE","debit",684),tx(4,4,"Transferencia de Luis H.","credit",2500),tx(5,6,"Netflix","debit",219),tx(6,7,"Gasolinera Norte","debit",850),tx(7,9,"Retiro cajero","debit",2000),tx(8,11,"Restaurante El Patio","debit",980),tx(9,13,"Reembolso compra","credit",420),tx(10,15,"Renta departamento","debit",9500)],
        2: [tx(14,0,"Traspaso en proceso","debit",1500,"pending"),tx(11,5,"Interés mensual","credit",312.4),tx(12,20,"Traspaso desde nómina","credit",5000)]
      },
      beneficiaries: [
        {id:90, userId:1, alias:"Luis", name:"Luis Hernández", clabe:"014180005550001112", bank:"Santander"},
        {id:91, userId:1, alias:"Renta", name:"Inmobiliaria Torres", clabe:"072180007770002223", bank:"Banorte"}
      ],
      services: [{id:1, name:"CFE (luz)"}, {id:2, name:"Telmex"}, {id:3, name:"Agua potable"}, {id:4, name:"Izzi"}, {id:5, name:"Gas Natural"}],
      payments: [{id:80, userId:1, date: new Date(now - 3 * day).toISOString(), service:"CFE (luz)", reference:"0123456789", amount:684, account:"Cuenta de nómina", status:"completed"}],
      cards: [
        {id:1, userId:1, name:"Nova Débito", type:"Débito", last4:"4821", expires:"09/29", status:"active", limit:null, used:null},
        {id:2, userId:1, name:"Nova Platinum", type:"Crédito", last4:"9032", expires:"03/30", status:"active", limit:50000, used:12400}
      ],
      audit: [
        {id:70, date: new Date(now - 2 * day).toISOString(), actor:"Admin Nova", action:"Bloqueo de usuario", detail:"Sofía Ramírez"},
        {id:71, date: new Date(now - 6 * day).toISOString(), actor:"Marta Núñez", action:"Alta de usuario", detail:"carlos@correo.mx"}
      ],
      seq: 100
    };
  },
  db() { try { const d = JSON.parse(localStorage.getItem(this.KEY)); if (d) return d; } catch {} const d = this.seed(); this.save(d); return d; },
  save(d) { localStorage.setItem(this.KEY, JSON.stringify(d)); },
  fail(msg, status = 400) { throw new ApiError(msg, status); },
  log(db, actor, action, detail) { (db.audit ||= []).unshift({id: ++db.seq, date: new Date().toISOString(), actor, action, detail}); },
  auth(db) {
    const t = Session.token; if (!t) this.fail("No autenticado", 401);
    const u = db.users.find(x => "mock-" + x.id === t); if (!u) this.fail("No autenticado", 401);
    return u;
  },
  async handle(method, path, body) {
    await sleep(250);
    const db = this.db(), url = new URL(path, "http://x"), p = url.pathname, q = Object.fromEntries(url.searchParams);
    let m;
    if (method === "POST" && p === "/auth/login") {
      const c = db.credentials[(body.email || "").toLowerCase()];
      if (!c || c.password !== body.password) this.fail("Correo o contraseña incorrectos", 401);
      const u = db.users.find(x => x.id === c.userId);
      if (u.status === "blocked") this.fail("Tu cuenta está bloqueada. Contacta a soporte.", 403);
      this.log(db, u.name, "Inicio de sesión", u.email); this.save(db);
      return {token: "mock-" + u.id, user: {id:u.id, name:u.name, email:u.email, role:u.role}};
    }
    if (method === "POST" && p === "/auth/logout") return {ok:true};
    if (method === "POST" && p === "/auth/register") {
      const email = (body.email || "").toLowerCase();
      if (db.credentials[email]) this.fail("Ese correo ya está registrado", 409);
      const id = ++db.seq;
      db.users.push({id, name: body.name, email, role:"customer", status:"active", created_at: new Date().toISOString().slice(0, 10)});
      db.credentials[email] = {password: body.password, userId: id};
      db.accounts.push({id: ++db.seq, userId: id, name:"Cuenta Nova", type:"Débito", clabe: "01218" + String(Math.random()).slice(2, 15).padEnd(13, "0"), balance: 0, currency:"MXN"});
      this.log(db, body.name, "Registro", "Nuevo cliente " + email);
      this.save(db); return {message:"Cuenta creada"};
    }
    if (method === "POST" && p === "/auth/forgot-password") return {message:"Si el correo existe, enviamos instrucciones."};
    const me = this.auth(db);
    if (method === "GET" && p === "/accounts") return db.accounts.filter(a => a.userId === me.id);
    if (method === "GET" && (m = p.match(/^\/accounts\/(\d+)\/transactions$/))) {
      const acc = db.accounts.find(a => a.id == m[1] && a.userId === me.id); if (!acc) this.fail("Cuenta no encontrada", 404);
      let items = [...(db.tx[acc.id] || [])].sort((a, b) => b.date.localeCompare(a.date));
      if (q.type) items = items.filter(t => t.type === q.type);
      if (q.search) items = items.filter(t => t.concept.toLowerCase().includes(q.search.toLowerCase()));
      const page = +q.page || 1, size = +q.pageSize || 6;
      return {items: items.slice((page - 1) * size, page * size), total: items.length, page, pageSize: size};
    }
    if (method === "POST" && p === "/transfers") {
      const acc = db.accounts.find(a => a.id == body.from_account_id && a.userId === me.id);
      if (!acc) this.fail("Cuenta de origen inválida", 404);
      if (!(body.amount > 0)) this.fail("Monto inválido");
      if (body.amount > acc.balance) this.fail("Fondos insuficientes");
      acc.balance = Math.round((acc.balance - body.amount) * 100) / 100;
      const id = "t" + (++db.seq);
      (db.tx[acc.id] ||= []).push({id, date: new Date().toISOString(), concept: body.concept || "Transferencia SPEI", type:"debit", amount: body.amount, status:"completed"});
      this.log(db, me.name, "Transferencia", money(body.amount) + " desde " + acc.name);
      this.save(db); return {id, status:"completed"};
    }
    if (method === "GET" && p === "/beneficiaries") return (db.beneficiaries || []).filter(b => b.userId === me.id);
    if (method === "POST" && p === "/beneficiaries") {
      if (!/^\d{18}$/.test(body.clabe || "")) this.fail("CLABE inválida");
      const list = (db.beneficiaries ||= []);
      if (list.some(b => b.userId === me.id && b.clabe === body.clabe)) this.fail("Ese beneficiario ya existe", 409);
      const bank = {"002":"Banamex","012":"BBVA","014":"Santander","021":"HSBC","072":"Banorte"}[body.clabe.slice(0, 3)] || "Otro banco";
      const b = {id: ++db.seq, userId: me.id, alias: body.alias, name: body.name, clabe: body.clabe, bank};
      list.push(b); this.save(db); return b;
    }
    if (method === "DELETE" && (m = p.match(/^\/beneficiaries\/(\d+)$/))) {
      db.beneficiaries = (db.beneficiaries || []).filter(b => !(b.id == m[1] && b.userId === me.id));
      this.save(db); return {ok:true};
    }
    if (method === "GET" && p === "/services") return db.services;
    if (method === "GET" && p === "/payments") return (db.payments || []).filter(x => x.userId === me.id).sort((a, b) => b.date.localeCompare(a.date));
    if (method === "POST" && p === "/payments") {
      const acc = db.accounts.find(a => a.id == body.from_account_id && a.userId === me.id);
      const svc = db.services.find(s => s.id == body.service_id);
      if (!acc || !svc) this.fail("Datos de pago inválidos", 404);
      if (!(body.amount > 0)) this.fail("Monto inválido");
      if (body.amount > acc.balance) this.fail("Fondos insuficientes");
      acc.balance = Math.round((acc.balance - body.amount) * 100) / 100;
      (db.tx[acc.id] ||= []).push({id: "t" + (++db.seq), date: new Date().toISOString(), concept: "Pago " + svc.name, type:"debit", amount: body.amount, status:"completed"});
      const pay = {id: ++db.seq, userId: me.id, date: new Date().toISOString(), service: svc.name, reference: body.reference, amount: body.amount, account: acc.name, status:"completed"};
      (db.payments ||= []).push(pay);
      this.log(db, me.name, "Pago de servicio", svc.name + " · " + money(body.amount));
      this.save(db); return pay;
    }
    if (method === "GET" && p === "/cards") return (db.cards || []).filter(c => c.userId === me.id);
    if (method === "PATCH" && (m = p.match(/^\/cards\/(\d+)$/))) {
      const c = (db.cards || []).find(x => x.id == m[1] && x.userId === me.id); if (!c) this.fail("Tarjeta no encontrada", 404);
      c.status = body.status; this.log(db, me.name, body.status === "blocked" ? "Bloqueo de tarjeta" : "Activación de tarjeta", c.name + " ****" + c.last4);
      this.save(db); return c;
    }
    if (method === "GET" && p === "/profile") return {name: me.name, email: me.email, phone: me.phone || "", address: me.address || ""};
    if (method === "PUT" && p === "/profile") { Object.assign(me, {name: body.name, phone: body.phone, address: body.address}); this.save(db); return {ok:true}; }
    if (method === "POST" && p === "/profile/password") {
      const cred = db.credentials[me.email.toLowerCase()];
      if (!cred || cred.password !== body.current) this.fail("La contraseña actual es incorrecta");
      cred.password = body.password; this.log(db, me.name, "Cambio de contraseña", me.email); this.save(db); return {ok:true};
    }
    if (p.startsWith("/admin")) {
      if (me.role !== "admin") this.fail("Acceso denegado", 403);
      if (method === "GET" && p === "/admin/stats") {
        const vol = Object.values(db.tx).flat().reduce((s, t) => s + t.amount, 0);
        return {users: db.users.length, active: db.users.filter(u => u.status === "active").length, blocked: db.users.filter(u => u.status === "blocked").length, volume: vol};
      }
      if (method === "GET" && p === "/admin/users") {
        let l = db.users;
        if (q.status) l = l.filter(u => u.status === q.status);
        if (q.search) { const s = q.search.toLowerCase(); l = l.filter(u => u.name.toLowerCase().includes(s) || u.email.toLowerCase().includes(s)); }
        return l;
      }
      if (method === "POST" && p === "/admin/users") {
        if (db.users.some(u => u.email.toLowerCase() === body.email.toLowerCase())) this.fail("Ese correo ya está registrado", 409);
        const u = {id: ++db.seq, name: body.name, email: body.email, role: body.role, status:"active", created_at: new Date().toISOString().slice(0, 10)};
        db.users.push(u); db.credentials[body.email.toLowerCase()] = {password: body.password, userId: u.id};
        this.log(db, me.name, "Alta de usuario", body.email);
        this.save(db); return u;
      }
      if ((m = p.match(/^\/admin\/users\/(\d+)$/)) && method === "PUT") {
        const u = db.users.find(x => x.id == m[1]); if (!u) this.fail("Usuario no encontrado", 404);
        Object.assign(u, {name: body.name, email: body.email, role: body.role}); this.save(db); return u;
      }
      if ((m = p.match(/^\/admin\/users\/(\d+)\/status$/)) && method === "PATCH") {
        const u = db.users.find(x => x.id == m[1]); if (!u) this.fail("Usuario no encontrado", 404);
        if (u.id === me.id) this.fail("No puedes bloquear tu propia cuenta");
        u.status = body.status; this.log(db, me.name, body.status === "blocked" ? "Bloqueo de usuario" : "Activación de usuario", u.name); this.save(db); return u;
      }
    }
    if (method === "GET" && (p === "/admin/transactions" || p === "/admin/audit")) {
      if (me.role !== "admin") this.fail("Acceso denegado", 403);
      const page = +q.page || 1, size = +q.pageSize || 8, s = (q.search || "").toLowerCase();
      let items;
      if (p === "/admin/audit") {
        items = [...(db.audit || [])];
        if (s) items = items.filter(a => (a.actor + " " + a.action + " " + a.detail).toLowerCase().includes(s));
      } else {
        items = db.accounts.flatMap(a => (db.tx[a.id] || []).map(t => ({...t, customer: (db.users.find(u => u.id === a.userId) || {}).name, account: a.name})));
        items.sort((a, b) => b.date.localeCompare(a.date));
        if (q.status) items = items.filter(t => t.status === q.status);
        if (q.type) items = items.filter(t => t.type === q.type);
        if (s) items = items.filter(t => (t.concept + " " + t.customer).toLowerCase().includes(s));
      }
      return {items: items.slice((page - 1) * size, page * size), total: items.length, page, pageSize: size};
    }
    this.fail("Ruta no encontrada: " + method + " " + p, 404);
  }
};

/* ---------- Layout ---------- */
function shell(title, crumb, content) {
  const u = Session.user, route = location.hash.replace("#", "");
  const link = (href, label, icon) => `<a href="#${href}" class="${route === href ? "active" : ""}"><span>${icon}</span>${label}</a>`;
  $("#app").innerHTML = `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><i>N</i> Banco Nova</div>
      <nav class="nav">
        <h4>Banca personal</h4>
        ${link("/personal", "Resumen", "▣")}
        ${link("/cuentas", "Cuentas", "▤")}
        ${link("/transferencias", "Beneficiarios", "⇄")}
        ${link("/pagos", "Pago de servicios", "◉")}
        ${link("/tarjetas", "Tarjetas", "▭")}
        ${link("/perfil", "Mi perfil", "☺")}
        ${u.role === "admin" ? `<h4>Administración</h4>${link("/admin", "Usuarios", "⚙")}${link("/admin/transacciones", "Transacciones", "≡")}${link("/admin/auditoria", "Auditoría", "✓")}` : ""}
        <h4>Diseño</h4>
        ${link("/componentes", "Componentes", "◧")}
      </nav>
      <div class="me"><b>${esc(u.name)}</b>${esc(u.email)}<button data-logout>Cerrar sesión</button></div>
    </aside>
    <main class="main">
      <div class="topbar"><div><div class="crumb">${esc(crumb)}</div><h1>${esc(title)}</h1></div></div>
      <div id="view">${content}</div>
    </main>
  </div>`;
  $("[data-logout]").onclick = async () => { await Api.logout(); Session.clear(); location.hash = "#/login"; };
}
const errBox = e => `<div class="alert err">${esc(e.message)}</div>`;

    setErr("email", /^\S+@\S+\.\S+$/.test(email) ? "" : "Ingresa un correo válido");

}

/* ---------- 02 · Banca personal ---------- */
async function renderPersonal() {
  shell("Banca personal", "Inicio / Mis cuentas", `<div class="loading">Cargando cuentas…</div>`);
  let accounts;
  try { accounts = await Api.accounts(); } catch (e) { return $("#view").innerHTML = errBox(e); }
  if (!accounts.length) return $("#view").innerHTML = `<div class="empty card">Aún no tienes cuentas.</div>`;

  const preAcc = accounts.find(a => a.id === +sessionStorage.getItem("nova_acc")) || accounts[0];
  sessionStorage.removeItem("nova_acc");
  const st = {accId: preAcc.id, page: 1, search: "", type: ""};
  const acc = () => accounts.find(a => a.id === st.accId);

  $("#view").innerHTML = `
    <div class="grid g-3" id="kpis"></div>
    <div class="tabs" style="margin-top:18px" id="acc-tabs"></div>
    <div class="grid g-2-1">
      <div class="card">
        <h3>Movimientos</h3>
        <div class="toolbar">
          <input class="input" id="tx-search" placeholder="Buscar concepto…">
          <select class="select" id="tx-type"><option value="">Todos</option><option value="credit">Abonos</option><option value="debit">Cargos</option></select>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Estatus</th><th class="right">Monto</th></tr></thead><tbody id="tx-body"></tbody></table></div>
        <div class="pager" id="tx-pager"></div>
      </div>
      <div class="card">
        <h3>Transferir</h3>
        <form id="tr-form" novalidate>
          <div id="tr-err"></div>
          <div class="field"><label>CLABE destino (18 dígitos)</label><input class="input" id="tr-clabe" inputmode="numeric" maxlength="18" placeholder="000000000000000000"><span class="msg"></span></div>
          <div class="field"><label>Monto (MXN)</label><input class="input" id="tr-amount" type="number" step="0.01" min="0.01" placeholder="0.00"><span class="msg"></span></div>
          <div class="field"><label>Concepto</label><input class="input" id="tr-concept" maxlength="40" placeholder="Opcional"></div>
          <button class="btn btn-primary" style="width:100%;justify-content:center" id="tr-btn">Enviar transferencia</button>
        </form>
      </div>
    </div>`;

  function drawSummary() {
    const total = accounts.reduce((s, a) => s + a.balance, 0), a = acc();
    $("#kpis").innerHTML = `
      <div class="card kpi dark"><div class="label">Saldo total</div><div class="value">${money(total)}</div></div>
      <div class="card kpi"><div class="label">${esc(a.name)}</div><div class="value">${money(a.balance, a.currency)}</div></div>
      <div class="card kpi"><div class="label">CLABE · ${esc(a.type)}</div><div class="acc-meta" style="font-size:15px;color:var(--text);margin-top:10px">${esc(a.clabe)}</div></div>`;
    $("#acc-tabs").innerHTML = accounts.map(x => `<button class="tab ${x.id === st.accId ? "active" : ""}" data-acc="${x.id}">${esc(x.name)}</button>`).join("");
  }
  async function drawTx() {
    $("#tx-body").innerHTML = `<tr><td colspan="4" class="loading">Cargando…</td></tr>`;
    try {
      const r = await Api.transactions(st.accId, {search: st.search, type: st.type, page: st.page, pageSize: 6});
      $("#tx-body").innerHTML = r.items.length ? r.items.map(t => `
        <tr><td>${fdate(t.date)}</td><td>${esc(t.concept)}</td>
        <td><span class="badge ${t.status === "completed" ? "b-green" : "b-amber"}">${t.status === "completed" ? "Completado" : "Pendiente"}</span></td>
        <td class="right ${t.type === "credit" ? "pos" : "neg"}">${t.type === "credit" ? "+" : "−"}${money(t.amount)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="empty">Sin movimientos</td></tr>`;
      const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
      $("#tx-pager").innerHTML = `<span>${r.total} movimiento(s)</span><div>
        <button class="btn btn-secondary btn-sm" data-page="${r.page - 1}" ${r.page <= 1 ? "disabled" : ""}>Anterior</button>
        <span style="align-self:center">${r.page} / ${pages}</span>
        <button class="btn btn-secondary btn-sm" data-page="${r.page + 1}" ${r.page >= pages ? "disabled" : ""}>Siguiente</button></div>`;
    } catch (e) { $("#tx-body").innerHTML = `<tr><td colspan="4">${errBox(e)}</td></tr>`; }
  }

  drawSummary(); drawTx();
  const prefill = sessionStorage.getItem("nova_prefill");
  if (prefill) { $("#tr-clabe").value = prefill; sessionStorage.removeItem("nova_prefill"); $("#tr-amount").focus(); }
  $("#acc-tabs").onclick = e => { const b = e.target.closest("[data-acc]"); if (!b) return; st.accId = +b.dataset.acc; st.page = 1; drawSummary(); drawTx(); };
  $("#tx-pager").onclick = e => { const b = e.target.closest("[data-page]"); if (!b || b.disabled) return; st.page = +b.dataset.page; drawTx(); };
  $("#tx-search").oninput = debounce(e => { st.search = e.target.value.trim(); st.page = 1; drawTx(); });
  $("#tx-type").onchange = e => { st.type = e.target.value; st.page = 1; drawTx(); };

  $("#tr-form").onsubmit = async e => {
    e.preventDefault();
    const clabe = $("#tr-clabe").value.trim(), amount = parseFloat($("#tr-amount").value), concept = $("#tr-concept").value.trim();
    let ok = true;
    const setErr = (id, msg) => { const f = $("#" + id).closest(".field"); f.classList.toggle("error", !!msg); $(".msg", f).textContent = msg || ""; if (msg) ok = false; };
    setErr("tr-clabe", /^\d{18}$/.test(clabe) ? "" : "La CLABE debe tener 18 dígitos");
    setErr("tr-amount", amount > 0 ? (amount > acc().balance ? "Fondos insuficientes" : "") : "Ingresa un monto mayor a 0");
    if (!ok) return;
    const btn = $("#tr-btn"); btn.disabled = true; btn.textContent = "Enviando…"; $("#tr-err").innerHTML = "";
    try {
      await Api.transfer({from_account_id: st.accId, to_clabe: clabe, amount, concept});
      toast("Transferencia enviada", "ok");
      accounts = await Api.accounts(); e.target.reset(); st.page = 1; drawSummary(); drawTx();
    } catch (err) { $("#tr-err").innerHTML = errBox(err); }
    btn.disabled = false; btn.textContent = "Enviar transferencia";
  };
}

/* ---------- 03 · Administración ---------- */
async function renderAdmin() {
  shell("Administración", "Panel / Usuarios", `<div class="loading">Cargando…</div>`);
  $("#view").innerHTML = `
    <div class="grid g-4" id="stats"></div>
    <div class="card" style="margin-top:18px">
      <div class="toolbar">
        <input class="input" id="u-search" placeholder="Buscar por nombre o correo…">
        <select class="select" id="u-status"><option value="">Todos</option><option value="active">Activos</option><option value="blocked">Bloqueados</option></select>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="u-new">+ Nuevo usuario</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estatus</th><th>Alta</th><th class="right">Acciones</th></tr></thead><tbody id="u-body"></tbody></table></div>
    </div>`;
  const f = {search: "", status: ""};
  let users = [];

  async function loadStats() {
    try {
      const s = await Api.stats();
      $("#stats").innerHTML = `
        <div class="card kpi dark"><div class="label">Usuarios</div><div class="value">${s.users}</div></div>
        <div class="card kpi"><div class="label">Activos</div><div class="value">${s.active}</div></div>
        <div class="card kpi"><div class="label">Bloqueados</div><div class="value">${s.blocked}</div></div>
        <div class="card kpi"><div class="label">Volumen movido</div><div class="value">${money(s.volume)}</div></div>`;
    } catch (e) { $("#stats").innerHTML = errBox(e); }
  }
  async function loadUsers() {
    $("#u-body").innerHTML = `<tr><td colspan="6" class="loading">Cargando…</td></tr>`;
    try {
      users = await Api.users(f);
      $("#u-body").innerHTML = users.length ? users.map(u => `
        <tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td>
        <td><span class="badge ${u.role === "admin" ? "b-blue" : "b-amber"}">${u.role === "admin" ? "Admin" : "Cliente"}</span></td>
        <td><span class="badge ${u.status === "active" ? "b-green" : "b-red"}">${u.status === "active" ? "Activo" : "Bloqueado"}</span></td>
        <td>${fdate(u.created_at)}</td>
        <td class="right"><button class="btn btn-ghost btn-sm" data-edit="${u.id}">Editar</button>
        <button class="btn btn-ghost btn-sm" data-toggle="${u.id}">${u.status === "active" ? "Bloquear" : "Activar"}</button></td></tr>`).join("")
        : `<tr><td colspan="6" class="empty">Sin resultados</td></tr>`;
    } catch (e) { $("#u-body").innerHTML = `<tr><td colspan="6">${errBox(e)}</td></tr>`; }
  }
  function userModal(u) {
    const edit = !!u;
    openModal(`
      <h3>${edit ? "Editar usuario" : "Nuevo usuario"}</h3>
      <form id="u-form" novalidate><div id="u-err"></div>
        <div class="field"><label>Nombre completo</label><input class="input" id="f-name" value="${esc(u?.name)}"><span class="msg"></span></div>
        <div class="field"><label>Correo</label><input class="input" id="f-email" type="email" value="${esc(u?.email)}"><span class="msg"></span></div>
        <div class="field"><label>Rol</label><select class="select" id="f-role"><option value="customer" ${u?.role === "customer" ? "selected" : ""}>Cliente</option><option value="admin" ${u?.role === "admin" ? "selected" : ""}>Administrador</option></select></div>
        ${edit ? "" : `<div class="field"><label>Contraseña temporal</label><input class="input" id="f-pass" type="password"><span class="msg"></span></div>`}
        <div class="actions"><button type="button" class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" id="f-btn">Guardar</button></div>
      </form>`);
    $("#u-form").onsubmit = async e => {
      e.preventDefault();
      const d = {name: $("#f-name").value.trim(), email: $("#f-email").value.trim(), role: $("#f-role").value};
      if (!edit) d.password = $("#f-pass").value;
      let ok = true;
      const setErr = (id, msg) => { const fl = $("#" + id).closest(".field"); fl.classList.toggle("error", !!msg); $(".msg", fl).textContent = msg || ""; if (msg) ok = false; };
      setErr("f-name", d.name.length >= 3 ? "" : "Ingresa el nombre");
      setErr("f-email", /^\S+@\S+\.\S+$/.test(d.email) ? "" : "Correo inválido");
      if (!edit) setErr("f-pass", d.password.length >= 8 ? "" : "Mínimo 8 caracteres");
      if (!ok) return;
      const b = $("#f-btn"); b.disabled = true;
      try {
        edit ? await Api.updateUser(u.id, d) : await Api.createUser(d);
        closeModal(); toast(edit ? "Usuario actualizado" : "Usuario creado", "ok"); loadStats(); loadUsers();
      } catch (err) { $("#u-err").innerHTML = errBox(err); b.disabled = false; }
    };
  }

  loadStats(); loadUsers();
  $("#u-search").oninput = debounce(e => { f.search = e.target.value.trim(); loadUsers(); });
  $("#u-status").onchange = e => { f.status = e.target.value; loadUsers(); };
  $("#u-new").onclick = () => userModal(null);

/* ---------- Helpers compartidos ---------- */
const fieldErr = (id, msg) => { const f = $("#" + id).closest(".field"); f.classList.toggle("error", !!msg); const m = $(".msg", f); if (m) m.textContent = msg || ""; return !msg; };
const allOk = (...r) => r.every(Boolean);
const emailOk = v => /^\S+@\S+\.\S+$/.test(v);
const pagerHTML = r => {
  const pages = Math.max(1, Math.ceil(r.total / r.pageSize));
  return `<span>${r.total} registro(s)</span><div>
    <button class="btn btn-secondary btn-sm" data-page="${r.page - 1}" ${r.page <= 1 ? "disabled" : ""}>Anterior</button>
    <span style="align-self:center">${r.page} / ${pages}</span>
    <button class="btn btn-secondary btn-sm" data-page="${r.page + 1}" ${r.page >= pages ? "disabled" : ""}>Siguiente</button></div>`;
};
const authLayout = inner => `
  <div class="login">
    <section class="login-hero">
      <div class="brand"><i>N</i> Banco Nova</div>
      <div><h1>Tu banca, simple y segura.</h1><p>Consulta tus cuentas, transfiere en segundos y administra todo desde un solo lugar.</p></div>
      <small style="color:#8fa3cf">© ${new Date().getFullYear()} Banco Nova</small>
    </section>
    <section class="login-panel">${inner}</section>
  </div>`;

      $("#p-body").innerHTML = l.length ? l.map(x => `<tr><td>${fdate(x.date)}</td><td>${esc(x.service)}</td><td>${esc(x.reference)}</td><td>${esc(x.account)}</td><td class="right neg">${money(x.amount)}</td></tr>`).join("")

  $("#t-search").oninput = debounce(e => { f.search = e.target.value.trim(); f.page = 1; load(); });
  $("#t-status").onchange = e => { f.status = e.target.value; f.page = 1; load(); };
  $("#t-type").onchange = e => { f.type = e.target.value; f.page = 1; load(); };
  $("#t-pager").onclick = e => { const b = e.target.closest("[data-page]"); if (!b || b.disabled) return; f.page = +b.dataset.page; load(); };
}

/* ---------- 03 · Administración: auditoría ---------- */
async function renderAudit() {
  shell("Auditoría", "Administración / Bitácora", `
    <div class="card">
      <div class="toolbar"><input class="input" id="a-search" placeholder="Buscar usuario, acción o detalle…"></div>
      <div class="table-wrap"><table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody id="a-body"></tbody></table></div>
      <div class="pager" id="a-pager"></div>
    </div>`);
  const f = {search: "", page: 1, pageSize: 10};
  async function load() {
    $("#a-body").innerHTML = `<tr><td colspan="4" class="loading">Cargando…</td></tr>`;
    try {
      const r = await Api.adminAudit(f);
      $("#a-body").innerHTML = r.items.length ? r.items.map(a => `
        <tr><td>${esc(new Date(a.date).toLocaleString("es-MX"))}</td><td>${esc(a.actor)}</td><td><span class="badge b-blue">${esc(a.action)}</span></td><td>${esc(a.detail)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="empty">Sin registros</td></tr>`;
      $("#a-pager").innerHTML = pagerHTML(r);
    } catch (e) { $("#a-body").innerHTML = `<tr><td colspan="4">${errBox(e)}</td></tr>`; }
  }
  load();
  $("#a-search").oninput = debounce(e => { f.search = e.target.value.trim(); f.page = 1; load(); });
  $("#a-pager").onclick = e => { const b = e.target.closest("[data-page]"); if (!b || b.disabled) return; f.page = +b.dataset.page; load(); };
}

/* ---------- Router ---------- */
const routes = {
  "/login": {render: renderLogin, public: true},
  "/registro": {render: renderRegister, public: true},
  "/recuperar": {render: renderRecover, public: true},
  "/personal": {render: renderPersonal},
  "/cuentas": {render: renderAccounts},
  "/transferencias": {render: renderBeneficiaries},
  "/pagos": {render: renderPayments},
  "/tarjetas": {render: renderCards},
  "/perfil": {render: renderProfile},
  "/admin": {render: renderAdmin, admin: true},
  "/admin/transacciones": {render: renderAdminTx, admin: true},
  "/admin/auditoria": {render: renderAudit, admin: true},
  "/componentes": {render: renderComponents}
};
function router() {
  closeModal();
  const path = location.hash.replace("#", "") || "/login", r = routes[path];
  const u = Session.user;
  if (!r) { location.hash = u ? "#/personal" : "#/login"; return; }
  if (!r.public && !Session.token) { location.hash = "#/login"; return; }
  if (r.public && Session.token) { location.hash = u.role === "admin" ? "#/admin" : "#/personal"; return; }
  if (r.admin && u.role !== "admin") { toast("No tienes permisos para esa sección", "err"); location.hash = "#/personal"; return; }
  r.render();
}
addEventListener("hashchange", router);
router();
</script>
